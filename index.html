<style>
:root{color-scheme:light;--blue:#2269a3;--pale:#79b2d4;--orange:#e47b35;--ink:#222;--muted:#707070}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#fff;color:var(--ink);font-family:Montserrat,Arial,sans-serif;display:grid;place-items:center}
main{width:min(100% - 40px,420px);padding:55px 0 35px;text-align:center}
.logo{display:block;width:110px;height:auto;margin:0 auto 34px}
h1{font-size:20px;letter-spacing:.085em;font-weight:600;margin:0 0 15px}
.roles{font-size:10px;letter-spacing:.075em;color:var(--muted);margin:0 0 15px}
.roles span{color:var(--orange);padding:0 5px}
.position{font-size:11px;line-height:1.8;color:var(--muted);margin:0}
nav{display:flex;flex-direction:column;align-items:center;gap:0;margin:45px auto 32px}
nav a{display:block;width:100%;max-width:280px;padding:15px 12px;color:var(--blue);font-size:11px;letter-spacing:.065em;font-weight:600;text-decoration:none;text-align:center;transition:color .2s}
nav a:hover,nav a:focus-visible{color:var(--orange)}
.social{display:flex;justify-content:center;gap:25px;margin-bottom:29px}
.social a{color:var(--pale);display:inline-flex;align-items:center;justify-content:center}
.social a:hover,.social a:focus-visible{color:var(--orange)}
.social svg{width:22px;height:22px;fill:currentColor}
footer{font-size:10px;color:#999;letter-spacing:.02em}
@media(max-width:400px){main{padding-top:38px}h1{font-size:18px}.roles{font-size:9px}}
</style>
</head>
